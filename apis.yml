aid: based
name: Based
description: 'Based is a consumer crypto super app built on Hyperliquid that unifies
  trading, prediction markets, and real-world payments in a single self-custody account.
  Users trade spot and perpetual futures with sub-second execution and deep liquidity,
  speculate on prediction markets, and spend crypto from Solana, Arbitrum, and Polygon
  at 70+ million Visa merchants across 160+ countries via Based debit cards, including
  the premium Gold+ card. BasedCloud lets partners spin up white-label Hyperliquid
  trading frontends (web, mobile, desktop, Telegram), and a three-tiered affiliate
  program amplifies Hyperliquid referral fees. Based is backed by Pantera Capital,
  Coinbase Ventures, Hashed, Ethena, and Spartan Group. It publishes consumer product
  docs on GitBook and an agent-oriented llms.txt index, but exposes no public developer
  API of its own — programmatic trading runs on the underlying Hyperliquid API.'
